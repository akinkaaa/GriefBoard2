# Как часто обновлять скорборд (в тиках, 20 = 1 секунда)
update-ticks: 20

title: "&6&l⚔ &#FFB020&lГРИФ &6&l⚔"

no-clan: "Без клана"
start-elo: 1000

# ---------- РАНГИ ----------
# Ранг, который получает новый игрок (название из списка ниже)
default-rank: "player"

# Выдача ранга: /rank set <ник> <ранг>   (нужен OP)
#   display      - как ранг выглядит в скорборде, табе и чате
#   op           - true = ранг даёт права оператора (все права)
#   permissions  - список прав, которые получает ранг (можно пустой [])
ranks:
  admin:
    display: "&#FF4500&l[ADMIN]"
    op: true
    permissions: []
  moder:
    display: "&#3B82F6&l[MODER]"
    op: false
    permissions:
      - "bukkit.command.kick"
      - "bukkit.command.ban.player"
      - "bukkit.command.unban.player"
      - "bukkit.command.teleport"
  builder:
    display: "&#00D4C8&l[BUILDER]"
    op: false
    permissions:
      - "worldedit.*"
      - "bukkit.command.gamemode"
  tester:
    display: "&#FACC15&l[TESTER]"
    op: false
    permissions: []
  player:
    display: "&8[&7PLAYER&8]"
    op: false
    permissions: []

# Плейсхолдеры: {player} {rank} {clan} {clanlevel} {kills} {deaths}
#               {cytrix} {balance} {ping} {pingcolor} {online} {max}
#               ({pillikov} {romashki} {elo} тоже работают, если захочешь вернуть)
# Цвета: &-коды и &#RRGGBB. Максимум 15 строк. Если значок не отображается,
# замени его на другой: ● ◆ ★ ➤ ✔ (они точно есть в шрифте игры).
lines:
  - ""
  - "&6▎ &e❖ &fНик: &#FF6B3D{player}"
  - "&6▎ &e♛ &fРанг: {rank}"
  - "&6▎ &e⚑ &fКлан: &#FF6B3D{clan}"
  - ""
  - "&6▎ &c⚔ &fУбийств: &#FF6B3D{kills}"
  - "&6▎ &7☠ &fСмертей: &#FF6B3D{deaths}"
  - ""
  - "&6▎ &a✦ &fCytrix: &a&l{cytrix}"
  - "&6▎ &e⬤ &fМонеты: &#FF6B3D{balance}"
  - ""
  - "&6▎ {pingcolor}● &fПинг: {pingcolor}{ping} &7мс &8| &f{online}&7/&f{max}"
  - ""
  - "&#FF4D2E&lGhostGrief.pw"

# ---------- TAB (список игроков по клавише Tab) ----------
# Плейсхолдеры те же + {online} {max} {tps}
tab:
  enabled: true
  header:
    - "&c&m                                        "
    - ""
    - "&c&lSERVER NAME"
    - ""
  footer:
    - ""
    - "&cОНЛАЙН: &f{online}/{max} &8| &cПИНГ: &f{ping} мс &8| &cTPS: &f{tps}"
    - "&cСАЙТ: &fdomain.com"
    - ""
    - "&cIP: &fserver.com"
    - "&c&m                                        "
  # Ранг и клан в табе теперь показывает раздел nametag (ниже), поэтому это поле работает
  # только если nametag.enabled: false
  name-format: "{rank} {clantag}&f{player}"

# ---------- ЧАТ ----------
# Плейсхолдеры: {rank} {player} {message}
chat:
  enabled: true
  format: "{rank} {clantag}&f{player}&8: &7{message}"

# ---------- RTP и яма ----------
rtp:
  world: "world"
  lobby-world: "lobby"
  min-radius: 300
  max-radius: 10000
  only-from-lobby: true
  cooldown-seconds: 5
pit:
  radius: 5
  trigger-below: 58

# ---------- ВХОД И РЕГИСТРАЦИЯ ----------
# Пока игрок не вошёл, он не может двигаться, писать в чат, ломать блоки и т.д.
# Пароли хранятся в plugins/GriefBoard/auth.yml только в виде хеша (не в открытом виде).
auth:
  enabled: true
  timeout-seconds: 60       # сколько секунд даётся на вход, потом кик
  remind-seconds: 5         # как часто повторять подсказку в чате и на экране
  max-attempts: 5           # неверных паролей до кика
  min-password-length: 6
  session-minutes: 10       # 0 = всегда вводить пароль; иначе вход без пароля с того же IP
  # Оформление: полоска времени, затемнение экрана, подсказка над хотбаром, звуки
  effects:
    bossbar: true
    blindness: true
    actionbar: true
    sounds: true
  # Сообщения. %player% - ник, %nl% - перенос строки, цвета через &
  messages:
    register-request: "%nl%&8&m                                  %nl%&6&l  ГРИФ &8| &fРегистрация%nl% %nl%&7  Привет, &f%player%&7!%nl%&7  Придумай пароль и введи:%nl%&e  /register &f<пароль> <повтор пароля>%nl%&8&m                                  %nl%"
    login-request: "%nl%&8&m                                  %nl%&6&l  ГРИФ &8| &fВход%nl% %nl%&7  С возвращением, &f%player%&7!%nl%&7  Введи свой пароль:%nl%&e  /login &f<пароль>%nl%&8&m                                  %nl%"
    register-title: "&6&lРегистрация"
    register-subtitle: "&e/register &f<пароль> <повтор>"
    login-title: "&6&lВход"
    login-subtitle: "&e/login &f<пароль>"
    register-usage: "&8[&6ГРИФ&8] &cИспользуй: &e/register &f<пароль> <повтор пароля>"
    login-usage: "&8[&6ГРИФ&8] &cИспользуй: &e/login &f<пароль>"
    change-usage: "&8[&6ГРИФ&8] &cИспользуй: &e/changepassword &f<старый> <новый>"
    password-mismatch: "&8[&6ГРИФ&8] &cПароли не совпадают, попробуй ещё раз."
    password-short: "&8[&6ГРИФ&8] &cПароль должен быть от %min% до 64 символов."
    password-name: "&8[&6ГРИФ&8] &cНельзя использовать ник в качестве пароля."
    name-taken: "&8[&6ГРИФ&8] &cЭтот ник уже зарегистрирован. Войди: &e/login &f<пароль>"
    not-registered: "&8[&6ГРИФ&8] &cТы ещё не зарегистрирован: &e/register &f<пароль> <повтор>"
    registered: "&8[&6ГРИФ&8] &aТы успешно зарегистрирован! &7Приятной игры, &f%player%&7."
    login-success: "&8[&6ГРИФ&8] &aТы успешно вошёл. &7С возвращением, &f%player%&7!"
    wrong-password: "&8[&6ГРИФ&8] &cНеверный пароль!"
    too-many-attempts: "&cСлишком много неверных паролей."
    timeout: "&cВремя на вход вышло. Зайди на сервер ещё раз."
    already-logged: "&8[&6ГРИФ&8] &cТы уже вошёл в аккаунт."
    must-auth-command: "&8[&6ГРИФ&8] &cСначала войди: &e/login &cили зарегистрируйся: &e/register"
    must-auth-chat: "&8[&6ГРИФ&8] &cЧат доступен только после входа."
    name-case: "&cЭтот ник зарегистрирован с другими заглавными буквами. Зайди с точным ником."
    password-changed: "&8[&6ГРИФ&8] &aПароль успешно изменён."
    wrong-old-password: "&8[&6ГРИФ&8] &cСтарый пароль неверный."
    session: "&8[&6ГРИФ&8] &aТы вошёл автоматически. &7С возвращением, &f%player%&7!"
    success-title: "&a&lДобро пожаловать"
    success-subtitle: "&7%player%"
    bossbar: "&6Осталось на вход: &f%time% &6сек."
    actionbar-login: "&e/login &f<пароль>"
    actionbar-register: "&e/register &f<пароль> <повтор>"

# ---------- КЛАНЫ ----------
# Команды: /clan (меню), /clan menu, /cc - чат клана
# В чате и табе тег клана в его цвете показывает {clantag}, в скорборде название - {clan},
# уровень клана - {clanlevel}
clans:
  enabled: true
  min-name-length: 3
  max-name-length: 12
  invite-seconds: 60          # сколько действует приглашение
  friendly-fire: false        # true = участники клана могут бить друг друга
  chat-format: "&8[&6Клан&8] &f{player}&8: &e{message}"
  points-per-kill: 10         # очки клана за убийство игрока из другого клана
  kill-cooldown-seconds: 600  # за одного и того же игрока очки не чаще, чем раз в это время
  home-warmup-seconds: 5      # сколько надо стоять перед телепортом в дом клана
  home-cooldown-seconds: 60
  # Уровни. Уровень растёт сам, когда у клана набирается нужное число очков.
  #   points       - очков нужно для уровня
  #   max-members  - максимум игроков в клане
  #   home         - открыт ли дом клана (/clan sethome, /clan home)
  #   glow         - открыто ли свечение тимы
  #   effects      - бонусные эффекты всем участникам, формат ЭФФЕКТ:уровень (0 = I)
  levels:
    1:
      points: 0
      max-members: 5
      home: false
      glow: false
      effects: []
    2:
      points: 100
      max-members: 8
      home: true
      glow: false
      effects: []
    3:
      points: 300
      max-members: 12
      home: true
      glow: true
      effects: []
    4:
      points: 700
      max-members: 16
      home: true
      glow: true
      effects: ["SPEED:0"]
    5:
      points: 1500
      max-members: 20
      home: true
      glow: true
      effects: ["SPEED:0", "FAST_DIGGING:0"]

# ---------- ТЕЛЕПОРТЫ (/tpa, /tpahere, /tpaccept, /tpdeny, /tpcancel, /tptoggle) ----------
tpa:
  enabled: true
  expire-seconds: 60       # сколько живёт запрос
  warmup-seconds: 5        # сколько надо стоять на месте перед телепортом
  cooldown-seconds: 30     # пауза между телепортами
  block-lobby: true        # true = нельзя телепортироваться со спавна и на спавн (выход только через /rtp)

# ---------- РАНГ И КЛАН НАД НИКОМ ----------
# Показывается над головой игрока и в списке Tab (Tab при этом сортируется по рангам:
# сначала ранги, которые выше в разделе ranks).
# Плейсхолдеры: {rank} {clansuffix} (" [Клан]" в цвете клана, пусто без клана) {player} и др.
# Тимы по клану видят ники друг друга в цвете клана (это включается в /clan menu).
nametag:
  enabled: true
  prefix: "{rank} "
  suffix: "{clansuffix}"
